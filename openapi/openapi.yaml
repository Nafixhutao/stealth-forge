components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: stealth_session }
    setupCookie: { type: apiKey, in: cookie, name: stealth_setup, description: Short-lived opaque HttpOnly setup session cookie. The cookie payload is encrypted server-side and is never returned in JSON. }
    bootstrapCLIProof: { type: apiKey, in: header, name: X-Stealth-Bootstrap-Proof, description: Derived proof sent only by the local CLI to mint a temporary first-owner setup session. Never send the installation key itself. }
    projectAppCookie: { type: apiKey, in: cookie, name: stealth_app_<project-id-without-hyphens>, description: Project-specific opaque HttpOnly cookie. The actual name is derived from the path projectID; it is never the Console stealth_session cookie. }
    projectApiKey: { type: apiKey, in: header, name: X-Stealth-Key, description: Project-bound server-to-server secret. Supported scopes include users, databases, storage, functions, sites, webhooks, realtime.read, and messaging read/write pairs; never send this header through the Console browser bridge. }
