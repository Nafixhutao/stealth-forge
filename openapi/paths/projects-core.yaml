paths:
  /v1/projects/{projectID}:
    get:
      operationId: getProject
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }]
      responses: { '200': { description: Project, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/ProjectResponse' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' } }
    patch:
      operationId: updateProject
      description: Update mutable project metadata. Only project owners and admins may change the project name.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/UpdateProjectRequest' } } } }
      responses: { '200': { description: Updated project, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/ProjectResponse' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }, '413': { $ref: '../components/common.yaml#/components/responses/PayloadTooLarge' }, '415': { $ref: '../components/common.yaml#/components/responses/UnsupportedMediaType' }, '422': { $ref: '../components/common.yaml#/components/responses/ValidationError' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
    delete:
      operationId: deleteProject
      description: Permanently delete a project and all of its tenant-owned resources. Only the organization owner may perform this operation; confirm_name must exactly match the current project name. Deletion returns a conflict while an App source upload or OCI artifact publication is reserved.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/DeleteProjectRequest' } } } }
      responses: { '204': { description: Project and all child resources deleted; App source and OCI artifacts are queued for durable cleanup }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }, '413': { $ref: '../components/common.yaml#/components/responses/PayloadTooLarge' }, '415': { $ref: '../components/common.yaml#/components/responses/UnsupportedMediaType' }, '422': { $ref: '../components/common.yaml#/components/responses/ValidationError' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
  /v1/projects/{projectID}/audit-events:
    get:
      operationId: listProjectAuditEvents
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }, { $ref: '../components/common.yaml#/components/parameters/Limit' }, { $ref: '../components/common.yaml#/components/parameters/Cursor' }]
      responses: { '200': { description: Durable audit events scoped to a project, content: { application/json: { schema: { $ref: '../components/organizations.yaml#/components/schemas/AuditEventsPage' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' } }
  /v1/projects/{projectID}/traces:
    get:
      operationId: listProjectTraces
      description: List the bounded durable root-request trace index for project members. Nested spans and full OpenTelemetry attributes remain in the private telemetry backend.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }, { $ref: '../components/common.yaml#/components/parameters/Limit' }, { $ref: '../components/common.yaml#/components/parameters/Cursor' }]
      responses: { '200': { description: Durable project request traces, content: { application/json: { schema: { $ref: '../components/organizations.yaml#/components/schemas/OrganizationTracesPage' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '422': { $ref: '../components/common.yaml#/components/responses/ValidationError' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
  /v1/projects/{projectID}/service-layout:
    get:
      operationId: listProjectServiceLayout
      description: List durable Services canvas positions visible to project members. Rows for resources that no longer exist are omitted.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }]
      responses: { '200': { description: Services canvas layout, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/ProjectServiceLayoutResponse' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
    put:
      operationId: replaceProjectServiceLayout
      description: Atomically replace the durable Services canvas positions. Only project owners and admins may save positions; every resource must belong to the project.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/ReplaceProjectServiceLayoutRequest' } } } }
      responses: { '200': { description: Saved Services canvas layout, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/ProjectServiceLayoutResponse' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '413': { $ref: '../components/common.yaml#/components/responses/PayloadTooLarge' }, '415': { $ref: '../components/common.yaml#/components/responses/UnsupportedMediaType' }, '422': { $ref: '../components/common.yaml#/components/responses/ValidationError' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
  /v1/agent-catalog:
    get:
      operationId: getAgentCatalog
      description: Return the server-backed Agent provider, model, role, and tool catalog. This response contains no provider credentials; execution is explicitly reported as queue-only until a trusted provider worker is installed.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Agent configuration catalog, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/AgentCatalogResponse' } } } }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
  /v1/agents:
    get:
      operationId: listAgents
      description: List persisted coding-agent configurations across projects visible to the current Console account. Provider credentials and run output are never returned.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '../components/common.yaml#/components/parameters/Limit' }
        - { $ref: '../components/common.yaml#/components/parameters/Cursor' }
        - { name: project_id, in: query, schema: { type: string, format: uuid }, description: Optional project filter. }
      responses: { '200': { description: Agent configurations, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/AgentsPage' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
    post:
      operationId: createAgent
      description: Create a persisted coding-agent configuration. Only project owners and admins may create agents; provider credentials are configured separately.
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/CreateAgentRequest' } } } }
      responses: { '201': { description: Agent configuration created, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/AgentResponse' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }, '413': { $ref: '../components/common.yaml#/components/responses/PayloadTooLarge' }, '415': { $ref: '../components/common.yaml#/components/responses/UnsupportedMediaType' }, '422': { $ref: '../components/common.yaml#/components/responses/ValidationError' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
  /v1/agents/{agentID}:
    get:
      operationId: getAgent
      description: Get one persisted coding-agent configuration when the current Console account can access its project.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/AgentID' }]
      responses: { '200': { description: Agent configuration, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/AgentResponse' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
    patch:
      operationId: updateAgent
      description: Update mutable agent configuration. Only project owners and admins may change it; status and activity timestamps are worker-owned.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/AgentID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/UpdateAgentRequest' } } } }
      responses: { '200': { description: Updated agent configuration, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/AgentResponse' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }, '413': { $ref: '../components/common.yaml#/components/responses/PayloadTooLarge' }, '415': { $ref: '../components/common.yaml#/components/responses/UnsupportedMediaType' }, '422': { $ref: '../components/common.yaml#/components/responses/ValidationError' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
    delete:
      operationId: deleteAgent
      description: Delete an agent configuration. Run history and provider connections are separate resources and are not implicitly exposed by this operation.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/AgentID' }]
      responses: { '204': { description: Agent configuration deleted }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
  /v1/agents/{agentID}/runs:
    get:
      operationId: listAgentRuns
      description: List durable Agent runs visible to the current Console account. Queued runs remain pending until a trusted execution worker is available.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/AgentID' }, { $ref: '../components/common.yaml#/components/parameters/Limit' }, { $ref: '../components/common.yaml#/components/parameters/Cursor' }]
      responses: { '200': { description: Agent run history, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/AgentRunsPage' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
    post:
      operationId: createAgentRun
      description: Accept an Agent prompt into the durable run queue. The request does not call a provider or execute repository code inline.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/AgentID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/CreateAgentRunRequest' } } } }
      responses: { '202': { description: Run accepted, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/AgentRunResponse' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '413': { $ref: '../components/common.yaml#/components/responses/PayloadTooLarge' }, '415': { $ref: '../components/common.yaml#/components/responses/UnsupportedMediaType' }, '422': { $ref: '../components/common.yaml#/components/responses/ValidationError' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } , '429': { $ref: '../components/common.yaml#/components/responses/RateLimited' } }
  /v1/agents/{agentID}/runs/{runID}:
    get:
      operationId: getAgentRun
      description: Get one durable Agent run and any worker-produced steps, output, or changes.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/AgentID' }, { $ref: '../components/common.yaml#/components/parameters/RunID' }]
      responses: { '200': { description: Agent run, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/AgentRunResponse' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
  /v1/agents/{agentID}/runs/{runID}/cancel:
    post:
      operationId: cancelAgentRun
      description: Cancel a queued or running Agent run. Only project owners and admins may cancel work.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/AgentID' }, { $ref: '../components/common.yaml#/components/parameters/RunID' }]
      responses: { '200': { description: Cancelled Agent run, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/AgentRunResponse' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
  /v1/agents/{agentID}/runs/{runID}/logs:
    get:
      operationId: listAgentRunLogs
      description: Read bounded execution logs emitted by the trusted Agent worker. Use after with the returned sequence number for incremental polling.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/AgentID' }, { $ref: '../components/common.yaml#/components/parameters/RunID' }, { $ref: '../components/common.yaml#/components/parameters/Limit' }, { name: after, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }]
      responses: { '200': { description: Agent run logs, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/AgentRunLogsPage' } } } }, '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }, '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }, '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }, '500': { $ref: '../components/common.yaml#/components/responses/InternalError' } }
  /v1/projects/{projectID}/users:
    get:
      operationId: listProjectUsers
      description: Members may read project application identities with a Console session. Server-side callers may use an X-Stealth-Key with users.read.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }, { $ref: '../components/common.yaml#/components/parameters/Limit' }, { $ref: '../components/common.yaml#/components/parameters/Cursor' }]
      responses:
        '200': { description: Application users visible to a project member, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/ProjectUsersPage' } } } }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '429': { $ref: '../components/common.yaml#/components/responses/RateLimited' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
        '500': { $ref: '../components/common.yaml#/components/responses/InternalError' }
    post:
      operationId: createProjectUser
      description: Owners/admins may create identities with a Console session. Server-side callers require an X-Stealth-Key with users.write.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/CreateProjectUserRequest' } } } }
      responses:
        '201': { description: Application user created, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/ProjectUserResponse' } } } }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
        '413': { $ref: '../components/common.yaml#/components/responses/PayloadTooLarge' }
        '415': { $ref: '../components/common.yaml#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '../components/common.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components/common.yaml#/components/responses/RateLimited' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
        '500': { $ref: '../components/common.yaml#/components/responses/InternalError' }
  /v1/projects/{projectID}/users/{userID}:
    get:
      operationId: getProjectUser
      description: Members may read a project application identity with a Console session. Server-side callers may use an X-Stealth-Key with users.read.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }, { $ref: '../components/common.yaml#/components/parameters/UserID' }]
      responses:
        '200': { description: Application user, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/ProjectUserResponse' } } } }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '429': { $ref: '../components/common.yaml#/components/responses/RateLimited' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
        '500': { $ref: '../components/common.yaml#/components/responses/InternalError' }
    delete:
      operationId: deleteProjectUser
      description: Permanently delete a project application identity. Its sessions and recovery tokens are revoked atomically; server-side callers require an X-Stealth-Key with users.write.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }, { $ref: '../components/common.yaml#/components/parameters/UserID' }]
      responses:
        '204': { description: Application user deleted }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '429': { $ref: '../components/common.yaml#/components/responses/RateLimited' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
        '500': { $ref: '../components/common.yaml#/components/responses/InternalError' }
  /v1/projects/{projectID}/users/{userID}/status:
    patch:
      operationId: updateProjectUserStatus
      description: Owners/admins may change status with a Console session. Server-side callers require an X-Stealth-Key with users.write.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }, { $ref: '../components/common.yaml#/components/parameters/UserID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/UpdateProjectUserStatusRequest' } } } }
      responses:
        '200': { description: Application user with the requested status, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/ProjectUserResponse' } } } }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '413': { $ref: '../components/common.yaml#/components/responses/PayloadTooLarge' }
        '415': { $ref: '../components/common.yaml#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '../components/common.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components/common.yaml#/components/responses/RateLimited' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
        '500': { $ref: '../components/common.yaml#/components/responses/InternalError' }
  /v1/projects/{projectID}/api-keys:
    get:
      operationId: listProjectAPIKeys
      description: List safe metadata for project-bound server-to-server API keys. The full secret and SHA-256 hash are never returned.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }, { $ref: '../components/common.yaml#/components/parameters/Limit' }, { $ref: '../components/common.yaml#/components/parameters/Cursor' }]
      responses:
        '200': { description: Safe API key metadata, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/ProjectAPIKeysPage' } } } }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '500': { $ref: '../components/common.yaml#/components/responses/InternalError' }
    post:
      operationId: createProjectAPIKey
      description: Owners/admins create a project-bound key. The high-entropy stl_key_ secret is returned exactly once; store it in a server-side secret manager.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '../components/common.yaml#/components/parameters/ProjectID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/CreateProjectAPIKeyRequest' } } } }
      responses:
        '201': { description: Safe metadata plus the one-time secret, content: { application/json: { schema: { $ref: '../components/projects-core.yaml#/components/schemas/CreateProjectAPIKeyResponse' } } } }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../components/common.yaml#/components/responses/Forbidden' }
