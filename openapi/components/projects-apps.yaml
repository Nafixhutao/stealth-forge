components:
  schemas:
    ApplicationAccountResponse: { type: object, additionalProperties: false, required: [account], properties: { account: { $ref: './projects-core.yaml#/components/schemas/ProjectUser' } } }
    App: { type: object, additionalProperties: false, required: [id, project_id, name, enabled, platform_hostname, workload, workload_spec_sha256, desired_generation, observed_generation, desired_deployment_id, runtime_status, runtime_error, health_status, route_status, created_at, updated_at], properties: { id: { type: string, format: uuid }, project_id: { type: string, format: uuid }, name: { $ref: './common.yaml#/components/schemas/Slug' }, enabled: { type: boolean, description: Desired enabled state. }, platform_hostname: { type: [string, 'null'], maxLength: 253, pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$', description: Canonical App hostname derived from the stable App identity and current workload_base_domain. Null when the workload domain is unset. A hostname alone does not make a route eligible. }, workload: { $ref: './projects-sites.yaml#/components/schemas/WorkloadSpec' }, workload_spec_sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of canonical normalized WorkloadSpec JSON. }, desired_generation: { type: integer, format: int64, minimum: 1, description: Runtime-relevant desired configuration generation consumed by the trusted runtime reconciler. }, observed_generation: { type: integer, format: int64, minimum: 0, description: Generation last confirmed by the trusted runtime reconciler; PostgreSQL persistence alone never advances it. }, desired_deployment_id: { type: [string, 'null'], format: uuid, description: Immutable image selected as desired state. The trusted runtime reconciler converges the persistent container asynchronously. }, runtime_status: { type: string, enum: [not_deployed, pending, running, degraded, stopped, failed], description: Running means the current expected container process is running; it does not imply application health. }, runtime_error: { type: [string, 'null'], maxLength: 512, description: Bounded sanitized error set by the trusted runtime reconciler. }, health_status: { type: string, enum: [pending, healthy, unhealthy], description: Health is generation and container specific. Healthy means the configured TCP or HTTP probe has converged. }, route_status: { type: string, enum: [not_available, waiting_for_runtime, waiting_for_health, active], description: "Active means the current desired, observed, healthy App is eligible for the public platform route." }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    AppDiagnosticDeploymentRef: { type: object, additionalProperties: false, required: [id, version], properties: { id: { type: string, format: uuid }, version: { type: integer, format: int64, minimum: 1 } }, description: Safe release identity for desired or last-applied state. }
    AppDiagnosticIssue: { type: object, additionalProperties: false, required: [code, severity, message], properties: { code: { type: string, enum: [generation_pending, deployment_pending, runtime_failed, runtime_degraded, health_pending, health_unhealthy, route_waiting_runtime, route_waiting_health, retry_scheduled, desired_artifact_unavailable, disabled, not_deployed] }, severity: { type: string, enum: [info, warning, error] }, message: { type: string, maxLength: 512 } } }
    AppDiagnostics: { type: object, additionalProperties: false, required: [app_id, project_id, convergence_status, desired_generation, observed_generation, applied_generation, desired_deployment, applied_deployment, desired_artifact_ready, runtime_status, runtime_error, health_status, route_status, failure_count, next_retry_at, last_failure_at, last_inspected_at, last_transition_at, last_started_at, last_stopped_at, health_checked_at, issues], properties: { app_id: { type: string, format: uuid }, project_id: { type: string, format: uuid }, convergence_status: { type: string, enum: [converged, reconciling, degraded, failed, stopped, not_deployed] }, desired_generation: { type: integer, format: int64, minimum: 1 }, observed_generation: { type: integer, format: int64, minimum: 0 }, applied_generation: { type: [integer, 'null'], format: int64, minimum: 0, description: Last generation recorded by the trusted runtime worker. }, desired_deployment: { oneOf: [{ $ref: './projects-apps.yaml#/components/schemas/AppDiagnosticDeploymentRef' }, { type: 'null' }] }, applied_deployment: { oneOf: [{ $ref: './projects-apps.yaml#/components/schemas/AppDiagnosticDeploymentRef' }, { type: 'null' }] }, desired_artifact_ready: { type: boolean, description: PostgreSQL metadata indicates a verified ready deployment and a structurally valid private artifact locator; the API does not inspect the artifact file. }, runtime_status: { type: string, enum: [not_deployed, pending, running, degraded, stopped, failed] }, runtime_error: { type: [string, 'null'], maxLength: 512, description: Existing sanitized runtime failure classification only. }, health_status: { type: string, enum: [pending, healthy, unhealthy], description: Uses the same generation and runtime identity projection as the App API. }, route_status: { type: string, enum: [not_available, waiting_for_runtime, waiting_for_health, active] }, failure_count: { type: integer, minimum: 0 }, next_retry_at: { type: [string, 'null'], format: date-time }, last_failure_at: { type: [string, 'null'], format: date-time }, last_inspected_at: { type: [string, 'null'], format: date-time }, last_transition_at: { type: [string, 'null'], format: date-time }, last_started_at: { type: [string, 'null'], format: date-time }, last_stopped_at: { type: [string, 'null'], format: date-time }, health_checked_at: { type: [string, 'null'], format: date-time }, issues: { type: array, maxItems: 12, items: { $ref: './projects-apps.yaml#/components/schemas/AppDiagnosticIssue' } } }, description: PostgreSQL-only diagnostic projection. Container IDs/names/addresses, image IDs/tags, routing identities, worker leases, artifact paths, environment values, ciphertext, and secret key material are omitted. }
    AppRollbackResponse: { type: object, additionalProperties: false, required: [app, deployment], properties: { app: { $ref: './projects-apps.yaml#/components/schemas/App' }, deployment: { $ref: './projects-apps.yaml#/components/schemas/AppDeployment' } }, description: Desired-state rollback acceptance; runtime convergence remains asynchronous. }
    CreateAppRequest: { type: object, additionalProperties: false, required: [name], properties: { name: { $ref: './common.yaml#/components/schemas/Slug' }, enabled: { type: boolean, description: Defaults to true when omitted. }, workload: { $ref: './projects-sites.yaml#/components/schemas/WorkloadSpecRequest', description: Optional partial v1 runtime intent; omitted fields receive the shared WorkloadSpec defaults. } } }
    UpdateAppRequest: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { $ref: './common.yaml#/components/schemas/Slug' }, enabled: { type: boolean }, workload: { $ref: './projects-sites.yaml#/components/schemas/WorkloadSpecRequest' } }, description: At least one field is required. Runtime-owned status and generation fields cannot be mutated here. }
    AppResponse: { type: object, additionalProperties: false, required: [app], properties: { app: { $ref: './projects-apps.yaml#/components/schemas/App' } } }
    AppsPage: { type: object, additionalProperties: false, required: [apps, pagination, can_manage], properties: { apps: { type: array, items: { $ref: './projects-apps.yaml#/components/schemas/App' } }, pagination: { $ref: './common.yaml#/components/schemas/Pagination' }, can_manage: { type: boolean } } }
    AppEnvironmentVariable: { type: object, additionalProperties: false, required: [id, app_id, project_id, key, is_secret, has_value, created_at, updated_at], properties: { id: { type: string, format: uuid }, app_id: { type: string, format: uuid }, project_id: { type: string, format: uuid }, key: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,119}$' }, is_secret: { type: boolean }, has_value: { type: boolean, description: Whether a write-only value is currently configured. }, description: { type: [string, 'null'], maxLength: 2000 }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } }, description: Safe metadata projection. Plaintext, ciphertext, nonce, and encryption keys are never returned. }
    CreateAppEnvironmentVariableRequest: { type: object, additionalProperties: false, required: [key], properties: { key: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,119}$' }, is_secret: { type: boolean, default: false }, value: { type: string, maxLength: 65536, writeOnly: true, description: "Plaintext is encrypted before durable persistence and never returned. Each value is limited to 65536 UTF-8 bytes and configured values are limited to 512 KiB total per App. NUL and CR/LF are unsupported by the line-based Docker env-file transport; multiline values are not supported." }, description: { type: string, maxLength: 2000 } } }
    UpdateAppEnvironmentVariableRequest: { type: object, additionalProperties: false, minProperties: 1, properties: { key: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,119}$' }, is_secret: { type: boolean }, value: { type: string, maxLength: 65536, writeOnly: true, description: "Replacement plaintext is never returned. Each value is limited to 65536 UTF-8 bytes and configured values are limited to 512 KiB total per App. NUL and CR/LF are unsupported by the line-based Docker env-file transport; multiline values are not supported." }, clear_value: { type: boolean, description: Remove the configured value without deleting its metadata. Cannot be combined with value. }, description: { type: string, maxLength: 2000 } } }
    AppEnvironmentVariableResponse: { type: object, additionalProperties: false, required: [variable], properties: { variable: { $ref: './projects-apps.yaml#/components/schemas/AppEnvironmentVariable' } } }
    AppEnvironmentVariablesPage: { type: object, additionalProperties: false, required: [variables, pagination, can_manage], properties: { variables: { type: array, items: { $ref: './projects-apps.yaml#/components/schemas/AppEnvironmentVariable' } }, pagination: { $ref: './common.yaml#/components/schemas/Pagination' }, can_manage: { type: boolean } } }
    AppDeployment: { type: object, additionalProperties: false, required: [id, app_id, project_id, version, source, source_name, source_size_bytes, source_checksum_sha256, dockerfile_path, context_directory, target, platform, workload_snapshot, workload_spec_sha256, status, build_status, error_message, image_digest, image_archive_sha256, image_size_bytes, selected, created_by_account_id, queued_at, build_started_at, built_at, finished_at, created_at, updated_at], properties: { id: { type: string, format: uuid }, app_id: { type: string, format: uuid }, project_id: { type: string, format: uuid }, version: { type: integer, format: int64, minimum: 1, description: Monotonic version allocated for this App. }, source: { type: string, enum: [upload] }, source_name: { type: [string, 'null'], maxLength: 255, description: User-supplied filename metadata only. }, source_size_bytes: { type: integer, format: int64, minimum: 1 }, source_checksum_sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the immutable uploaded source archive bytes. }, dockerfile_path: { type: string, minLength: 1, maxLength: 512 }, context_directory: { type: string, minLength: 1, maxLength: 512 }, target: { type: [string, 'null'], pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$' }, platform: { type: string, enum: [linux/amd64, linux/arm64] }, workload_snapshot: { $ref: './projects-sites.yaml#/components/schemas/WorkloadSpec' }, workload_spec_sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: Canonical WorkloadSpec snapshot digest captured at creation. }, status: { type: string, enum: [queued, building, ready, failed] }, build_status: { type: string, enum: [queued, running, deferred, succeeded, failed] }, error_message: { type: [string, 'null'], maxLength: 512 }, image_digest: { type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$', description: Immutable OCI manifest/image digest reported by BuildKit metadata and verified in the exported OCI layout. }, image_archive_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: SHA-256 checksum of Stealth's persisted OCI archive bytes; distinct from image_digest. }, image_size_bytes: { type: [integer, 'null'], format: int64, minimum: 1 }, selected: { type: boolean, description: Desired image selection only. It does not imply an App container is running. }, created_by_account_id: { type: [string, 'null'], format: uuid }, queued_at: { type: string, format: date-time }, build_started_at: { type: [string, 'null'], format: date-time }, built_at: { type: [string, 'null'], format: date-time }, finished_at: { type: [string, 'null'], format: date-time }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    AppDeploymentResponse: { type: object, additionalProperties: false, required: [deployment], properties: { deployment: { $ref: './projects-apps.yaml#/components/schemas/AppDeployment' } } }
    AppDeploymentsPage: { type: object, additionalProperties: false, required: [deployments, pagination, can_manage], properties: { deployments: { type: array, items: { $ref: './projects-apps.yaml#/components/schemas/AppDeployment' } }, pagination: { $ref: './common.yaml#/components/schemas/Pagination' }, can_manage: { type: boolean } } }
    AppDeploymentUploadRequest: { type: object, additionalProperties: false, required: [source], properties: { source: { type: string, format: binary, description: Required bounded .zip, .tar, .tar.gz, or .tgz source archive. }, dockerfile_path: { type: string, maxLength: 512, default: Dockerfile, description: Canonical path relative to the extracted source root. }, context_directory: { type: string, maxLength: 512, default: '.', description: Canonical build context path relative to the extracted source root. }, target: { type: string, maxLength: 128, description: Optional validated Dockerfile stage identifier. }, select: { type: string, enum: ['true', 'false'], default: 'false', description: When true, select this image as desired state only after a successful verified build. } } }
    AppBuildLog: { type: object, additionalProperties: false, required: [id, deployment_id, app_id, project_id, sequence, level, message, created_at], properties: { id: { type: string, format: uuid }, deployment_id: { type: string, format: uuid }, app_id: { type: string, format: uuid }, project_id: { type: string, format: uuid }, sequence: { type: integer, format: int64, minimum: 1 }, level: { type: string, enum: [info, warn, error] }, message: { type: string, minLength: 1, maxLength: 4096, description: Bounded and control-character-normalized. Older records beyond the retention window are truncated. }, created_at: { type: string, format: date-time } } }
    AppBuildLogsPage: { type: object, additionalProperties: false, required: [logs, pagination], properties: { logs: { type: array, items: { $ref: './projects-apps.yaml#/components/schemas/AppBuildLog' } }, pagination: { $ref: './common.yaml#/components/schemas/Pagination' } } }
    AppRuntimeLog: { type: object, additionalProperties: false, required: [id, created_at, level, message], properties: { id: { type: string, maxLength: 2048, description: Opaque stable line identity; does not expose the telemetry event ID. }, created_at: { type: string, format: date-time }, level: { type: string, maxLength: 64 }, message: { type: string, maxLength: 16384, description: Redacted and bounded to 16 KiB. } } }
    AppRuntimeLogsResponse: { type: object, additionalProperties: false, required: [logs], properties: { logs: { type: array, maxItems: 250, items: { $ref: './projects-apps.yaml#/components/schemas/AppRuntimeLog' } }, next_cursor: { type: string, maxLength: 2048, description: Opaque cursor for the next incremental page. } } }
