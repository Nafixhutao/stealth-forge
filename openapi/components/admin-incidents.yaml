components:
  schemas:
    AdminIncident: { type: object, additionalProperties: false, required: [id, title, severity, status, services, started_at, events, created_at, updated_at], properties: { id: { type: string, format: uuid }, title: { type: string }, severity: { type: string, enum: [info, warning, critical] }, status: { type: string, enum: [investigating, identified, monitoring, resolved] }, services: { type: array, items: { type: string } }, started_at: { type: string, format: date-time }, resolved_at: { type: [string, 'null'], format: date-time }, created_by_account_id: { type: [string, 'null'], format: uuid }, events: { type: array, items: { $ref: './admin-incidents.yaml#/components/schemas/AdminIncidentEvent' } }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    AdminIncidentEvent: { type: object, additionalProperties: false, required: [id, incident_id, kind, message, created_at], properties: { id: { type: string, format: uuid }, incident_id: { type: string, format: uuid }, kind: { type: string, enum: [alert, deployment, restart, backup, configuration, monitor, note] }, message: { type: string, maxLength: 2000 }, actor_account_id: { type: [string, 'null'], format: uuid }, created_at: { type: string, format: date-time } } }
    AdminIncidentsResponse: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: './admin-incidents.yaml#/components/schemas/AdminIncident' } } } }
    AdminIncidentResponse: { type: object, additionalProperties: false, required: [incident], properties: { incident: { $ref: './admin-incidents.yaml#/components/schemas/AdminIncident' } } }
    CreateAdminIncidentRequest: { type: object, additionalProperties: false, required: [title, severity, services], properties: { title: { type: string, minLength: 3, maxLength: 240 }, severity: { type: string, enum: [info, warning, critical] }, status: { type: string, enum: [investigating, identified, monitoring, resolved], default: investigating }, services: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }, message: { type: string, maxLength: 2000 } } }
    UpdateAdminIncidentRequest: { type: object, additionalProperties: false, minProperties: 1, properties: { title: { type: string, minLength: 3, maxLength: 240 }, severity: { type: string, enum: [info, warning, critical] }, status: { type: string, enum: [investigating, identified, monitoring, resolved] }, services: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }, message: { type: string, maxLength: 2000 } } }
    AddAdminIncidentEventRequest: { type: object, additionalProperties: false, required: [kind, message], properties: { kind: { type: string, enum: [alert, deployment, restart, backup, configuration, monitor, note] }, message: { type: string, minLength: 1, maxLength: 2000 } } }
