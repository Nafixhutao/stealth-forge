components:
  schemas:
    Status: { type: object, required: [status], properties: { status: { type: string, enum: [ok, ready] } } }
    BuildInfo: { type: object, required: [version, commit, build_time], properties: { version: { type: string }, commit: { type: string }, build_time: { type: string } } }
    Slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
    Pagination: { type: object, required: [limit, next_cursor], properties: { limit: { type: integer }, next_cursor: { type: [string, 'null'], format: uuid } } }
    ErrorEnvelope: { type: object, additionalProperties: false, required: [error], properties: { error: { type: object, additionalProperties: false, required: [code, message], properties: { code: { type: string }, message: { type: string } } } } }
  responses:
    BadRequest: { description: Invalid JSON or parameter, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    InvalidCredentials: { description: Invalid credentials, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    Forbidden: { description: Insufficient organization role, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    Conflict: { description: Resource conflict, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    NotReady: { description: Dependency unavailable, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    BadGateway: { description: GitHub or another upstream authorization provider is unavailable or returned an invalid response, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    InternalError: { description: Internal server error, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    RateLimited: { description: Operation rate limit exceeded, headers: { Retry-After: { description: Seconds until another attempt may be made, schema: { type: integer, minimum: 1 } } }, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    ServiceUnavailable: { description: Public Auth protection or a required dependency is unavailable, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    BootstrapComplete: { description: First-run Instance Owner setup is permanently sealed, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    PayloadTooLarge: { description: Request body exceeds the endpoint's configured limit (JSON requests are bounded separately from multipart uploads), content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    UnsupportedMediaType: { description: Content-Type must be application/json except for file upload multipart/form-data endpoints, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
    ValidationError: { description: Validation failed, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Cursor: { name: cursor, in: query, schema: { type: string, format: uuid } }
    OrganizationID: { name: organizationID, in: path, required: true, schema: { type: string, format: uuid } }
    IncidentID: { name: incidentID, in: path, required: true, schema: { type: string, format: uuid } }
    SessionID: { name: sessionID, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectID: { name: projectID, in: path, required: true, schema: { type: string, format: uuid } }
    AgentID: { name: agentID, in: path, required: true, schema: { type: string, format: uuid } }
    RunID: { name: runID, in: path, required: true, schema: { type: string, format: uuid } }
    UserID: { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    KeyID: { name: keyID, in: path, required: true, schema: { type: string, format: uuid } }
    DatabaseID: { name: databaseID, in: path, required: true, schema: { type: string, format: uuid } }
    BucketID: { name: bucketID, in: path, required: true, schema: { type: string, format: uuid } }
    FileID: { name: fileID, in: path, required: true, schema: { type: string, format: uuid } }
    TableID: { name: tableID, in: path, required: true, schema: { type: string, format: uuid } }
    ColumnID: { name: columnID, in: path, required: true, schema: { type: string, format: uuid } }
    IndexID: { name: indexID, in: path, required: true, schema: { type: string, format: uuid } }
    RelationshipID: { name: relationshipID, in: path, required: true, schema: { type: string, format: uuid } }
    BackupID: { name: backupID, in: path, required: true, schema: { type: string, format: uuid } }
    RowID: { name: rowID, in: path, required: true, schema: { type: string, format: uuid } }
    FunctionID: { name: functionID, in: path, required: true, schema: { type: string, format: uuid } }
    SiteID: { name: siteID, in: path, required: true, schema: { type: string, format: uuid } }
    AppID: { name: appID, in: path, required: true, schema: { type: string, format: uuid } }
    WebhookID: { name: webhookID, in: path, required: true, schema: { type: string, format: uuid } }
    ProviderID: { name: providerID, in: path, required: true, schema: { type: string, format: uuid } }
    TopicID: { name: topicID, in: path, required: true, schema: { type: string, format: uuid } }
    SubscriberID: { name: subscriberID, in: path, required: true, schema: { type: string, format: uuid } }
    MessageID: { name: messageID, in: path, required: true, schema: { type: string, format: uuid } }
    DomainID: { name: domainID, in: path, required: true, schema: { type: string, format: uuid } }
    VariableID: { name: variableID, in: path, required: true, schema: { type: string, format: uuid } }
    DeploymentID: { name: deploymentID, in: path, required: true, schema: { type: string, format: uuid } }
    ExecutionID: { name: executionID, in: path, required: true, schema: { type: string, format: uuid } }
    MonitorID: { name: monitorID, in: path, required: true, schema: { type: string, format: uuid } }
    AlertRuleID: { name: alertRuleID, in: path, required: true, schema: { type: string, format: uuid } }
    AdminIncidentID: { name: incidentID, in: path, required: true, schema: { type: string, format: uuid } }
    DashboardID: { name: dashboardID, in: path, required: true, schema: { type: string, format: uuid } }
    NotificationChannelID: { name: channelID, in: path, required: true, schema: { type: string, format: uuid } }
    BootstrapCLIProof: { name: X-Stealth-Bootstrap-Proof, in: header, required: true, schema: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' } }
    SetupCSRF: { name: X-Stealth-Setup, in: header, required: true, description: Required on setup mutations. The setup Console sends the fixed value 1 and the server additionally checks the browser origin when supplied., schema: { type: string, const: '1' } }
    RowCursor: { name: cursor, in: query, description: Opaque cursor returned by a previous row page; use it unchanged, schema: { type: string, minLength: 1, maxLength: 512 } }
    FilterJSON: { name: filter, in: query, description: 'JSON object of equality filters, for example {"status":"active"}. Each filtered column must have a real key index.', schema: { type: string, maxLength: 4096 } }
    OrderBy: { name: order_by, in: query, description: Declared required column key or id. Non-system columns must have a real key index., schema: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,119}$' } }
    OrderDirection: { name: order_direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
    Search: { name: search, in: query, description: Full-text search phrase. Requires search_column and a fulltext index on that varchar/text column., schema: { type: string, maxLength: 256 } }
    SearchColumn: { name: search_column, in: query, description: Declared varchar/text column whose fulltext index should evaluate search., schema: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,119}$' } }
