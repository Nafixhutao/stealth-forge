tion: Last successful external HTTPS verification for the observed Console origin. }, console_public_verified_origin: { type: string, enum: [proxy, traefik] }, last_reconciled_at: { type: [string, 'null'], format: date-time }, last_error: { type: string, maxLength: 512, description: Sanitized provider status with credentials removed. } } }
