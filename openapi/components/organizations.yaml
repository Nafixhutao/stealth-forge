components:
  schemas:
    Organization: { type: object, required: [id, name, slug, created_at], properties: { id: { type: string, format: uuid }, name: { type: string }, slug: { $ref: './common.yaml#/components/schemas/Slug' }, created_at: { type: string, format: date-time } } }
    OrganizationPlanLimits: { type: object, additionalProperties: false, required: [projects, members, databases, storage_buckets, functions, sites, apps], properties: { projects: { type: integer, format: int64, minimum: -1 }, members: { type: integer, format: int64, minimum: -1 }, databases: { type: integer, format: int64, minimum: -1 }, storage_buckets: { type: integer, format: int64, minimum: -1 }, functions: { type: integer, format: int64, minimum: -1 }, sites: { type: integer, format: int64, minimum: -1 }, apps: { type: integer, format: int64, minimum: -1, description: Free includes 3 Apps, Pro includes 25, and Enterprise is unlimited (-1). } }, description: A value of -1 means unlimited. }
    OrganizationPlanUsage: { type: object, additionalProperties: false, required: [projects, members, databases, storage_buckets, functions, sites, apps], properties: { projects: { type: integer, format: int64, minimum: 0 }, members: { type: integer, format: int64, minimum: 0 }, databases: { type: integer, format: int64, minimum: 0 }, storage_buckets: { type: integer, format: int64, minimum: 0 }, functions: { type: integer, format: int64, minimum: 0 }, sites: { type: integer, format: int64, minimum: 0 }, apps: { type: integer, format: int64, minimum: 0 } } }
    OrganizationPlan: { type: object, additionalProperties: false, required: [organization_id, plan_key, status, current_period_start, current_period_end, limits, usage], properties: { organization_id: { type: string, format: uuid }, plan_key: { type: string, enum: [free, pro, enterprise] }, status: { type: string, enum: [active, past_due, canceled] }, current_period_start: { type: string, format: date }, current_period_end: { type: string, format: date }, limits: { $ref: './organizations.yaml#/components/schemas/OrganizationPlanLimits' }, usage: { $ref: './organizations.yaml#/components/schemas/OrganizationPlanUsage' } } }
    Membership: { type: object, required: [organization_id, account_id, role, created_at], properties: { organization_id: { type: string, format: uuid }, account_id: { type: string, format: uuid }, email: { type: [string, 'null'], format: email, description: Null for provider-only identities without a verified email }, provider: { type: [string, 'null'], enum: [github, null] }, provider_login: { type: [string, 'null'] }, role: { type: string, enum: [owner, admin, developer, viewer, billing] }, created_at: { type: string, format: date-time } } }
    AuditEvent: { type: object, additionalProperties: false, required: [id, organization_id, action, target_type, metadata, created_at], properties: { id: { type: string, format: uuid }, organization_id: { type: string, format: uuid }, actor_account_id: { type: [string, 'null'], format: uuid }, actor_email: { type: [string, 'null'], format: email }, action: { type: string, minLength: 3, maxLength: 120 }, target_type: { type: string, minLength: 3, maxLength: 80 }, target_id: { type: [string, 'null'], format: uuid }, metadata: { type: object, additionalProperties: true }, created_at: { type: string, format: date-time } } }
    OrganizationResponse: { type: object, required: [organization], properties: { organization: { $ref: './organizations.yaml#/components/schemas/Organization' } } }
    OrganizationPlanResponse: { type: object, additionalProperties: false, required: [plan], properties: { plan: { $ref: './organizations.yaml#/components/schemas/OrganizationPlan' } } }
    OrganizationsPage: { type: object, required: [organizations, pagination], properties: { organizations: { type: array, items: { $ref: './organizations.yaml#/components/schemas/Organization' } }, pagination: { $ref: './common.yaml#/components/schemas/Pagination' } } }
    MembershipResponse: { type: object, additionalProperties: false, required: [membership], properties: { membership: { $ref: './organizations.yaml#/components/schemas/Membership' } } }
    MembershipsPage: { type: object, additionalProperties: false, required: [memberships, pagination, can_manage], properties: { memberships: { type: array, items: { $ref: './organizations.yaml#/components/schemas/Membership' } }, pagination: { $ref: './common.yaml#/components/schemas/Pagination' }, can_manage: { type: boolean, description: Whether the current organization membership may add, update, or remove regular members. } } }
    OrganizationInvitation: { type: object, additionalProperties: false, required: [id, organization_id, email, role, status, expires_at, created_at], properties: { id: { type: string, format: uuid }, organization_id: { type: string, format: uuid }, email: { type: string, format: email }, role: { type: string, enum: [admin, developer, viewer, billing] }, invited_by_account_id: { type: [string, 'null'], format: uuid }, invited_by_email: { type: [string, 'null'], format: email }, status: { type: string, enum: [pending, expired, accepted, revoked] }, expires_at: { type: string, format: date-time }, accepted_at: { type: [string, 'null'], format: date-time }, revoked_at: { type: [string, 'null'], format: date-time }, created_at: { type: string, format: date-time } } }
    OrganizationInvitationResponse: { type: object, additionalProperties: false, required: [invitation, delivery], properties: { invitation: { $ref: './organizations.yaml#/components/schemas/OrganizationInvitation' }, delivery: { type: string, enum: [sent, failed], description: Whether the configured email sender accepted the invitation message. The invitation remains persisted when delivery fails. } } }
    OrganizationInvitationsPage: { type: object, additionalProperties: false, required: [invitations, pagination, can_manage], properties: { invitations: { type: array, items: { $ref: './organizations.yaml#/components/schemas/OrganizationInvitation' } }, pagination: { $ref: './common.yaml#/components/schemas/Pagination' }, can_manage: { type: boolean, description: Whether the caller may create or revoke invitations. } } }
    OrganizationIncidentUpdate: { type: object, additionalProperties: false, required: [id, incident_id, status, message, created_at], properties: { id: { type: string, format: uuid }, incident_id: { type: string, format: uuid }, author_account_id: { type: [string, 'null'], format: uuid }, author_email: { type: [string, 'null'], format: email }, status: { type: string, enum: [investigating, identified, monitoring, resolved] }, message: { type: string, minLength: 1, maxLength: 4000 }, created_at: { type: string, format: date-time } } }
    OrganizationIncident: { type: object, additionalProperties: false, required: [id, organization_id, title, severity, status, services, started_at, updates, created_at, updated_at], properties: { id: { type: string, format: uuid }, organization_id: { type: string, format: uuid }, created_by_account_id: { type: [string, 'null'], format: uuid }, created_by_email: { type: [string, 'null'], format: email }, title: { type: string, minLength: 3, maxLength: 160 }, severity: { type: string, enum: [critical, warning, info] }, status: { type: string, enum: [investigating, identified, monitoring, resolved] }, services: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 80 } }, started_at: { type: string, format: date-time }, resolved_at: { type: [string, 'null'], format: date-time }, updates: { type: array, items: { $ref: './organizations.yaml#/components/schemas/OrganizationIncidentUpdate' } }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    OrganizationIncidentResponse: { type: object, additionalProperties: false, required: [incident], properties: { incident: { $ref: './organizations.yaml#/components/schemas/OrganizationIncident' } } }
    OrganizationIncidentDetailResponse: { type: object, additionalProperties: false, required: [incident, can_manage], properties: { incident: { $ref: './organizations.yaml#/components/schemas/OrganizationIncident' }, can_manage: { type: boolean } } }
    OrganizationIncidentsPage: { type: object, additionalProperties: false, required: [incidents, pagination, can_manage], properties: { incidents: { type: array, items: { $ref: './organizations.yaml#/components/schemas/OrganizationIncident' } }, pagination: { $ref: './common.yaml#/components/schemas/Pagination' }, can_manage: { type: boolean, description: Whether the caller may create or update incidents. } } }
    HTTPTrace: { type: object, additionalProperties: false, required: [id, trace_id, service, method, route, status, duration_ms, response_bytes, started_at, finished_at, created_at], properties: { id: { type: string, format: uuid }, trace_id: { type: string, minLength: 16, maxLength: 64, pattern: '^[0-9a-fA-F]+$' }, span_id: { type: [string, 'null'], minLength: 8, maxLength: 32, pattern: '^[0-9a-fA-F]+$' }, organization_id: { type: [string, 'null'], format: uuid }, project_id: { type: [string, 'null'], format: uuid }, organization_name: { type: string, maxLength: 255 }, project_name: { type: string, maxLength: 255 }, service: { type: string, minLength: 1, maxLength: 64 }, method: { type: string, minLength: 3, maxLength: 16 }, route: { type: string, minLength: 1, maxLength: 240 }, status: { type: integer, minimum: 100, maximum: 599 }, duration_ms: { type: integer, format: int64, minimum: 0 }, response_bytes: { type: integer, format: int64, minimum: 0 }, started_at: { type: string, format: date-time }, finished_at: { type: string, format: date-time }, created_at: { type: string, format: date-time } } }
    OrganizationTracesPage: { type: object, additionalProperties: false, required: [traces, pagination], properties: { traces: { type: array, items: { $ref: './organizations.yaml#/components/schemas/HTTPTrace' } }, pagination: { $ref: './common.yaml#/components/schemas/Pagination' } } }
    AuditEventsPage: { type: object, additionalProperties: false, required: [events, pagination], properties: { events: { type: array, items: { $ref: './organizations.yaml#/components/schemas/AuditEvent' } }, pagination: { $ref: './common.yaml#/components/schemas/Pagination' } } }
