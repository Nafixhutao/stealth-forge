components:
  schemas:
    AdminComponentStatus: { type: object, additionalProperties: false, required: [name, status], properties: { name: { type: string, minLength: 1, maxLength: 64 }, status: { type: string, enum: [healthy, unavailable, unknown] } } }
    AdminOverviewResponse: { type: object, additionalProperties: false, required: [instance_status, checked_at, components, telemetry], properties: { instance_status: { type: string, enum: [healthy, degraded] }, checked_at: { type: string, format: date-time }, components: { type: array, items: { $ref: './admin-core.yaml#/components/schemas/AdminComponentStatus' } }, telemetry: { $ref: './admin-telemetry.yaml#/components/schemas/AdminTelemetryStatus' }, http: { $ref: './admin-core.yaml#/components/schemas/AdminHTTPOverview' }, operations: { $ref: './admin-core.yaml#/components/schemas/AdminOperationSummary' }, recent_deployments: { type: array, items: { $ref: './admin-core.yaml#/components/schemas/AdminRecentDeployment' } } } }
    AdminRecentDeployment: { type: object, additionalProperties: false, required: [id, app_name, version, status, build_status, created_at], properties: { id: { type: string, format: uuid }, app_name: { type: string }, version: { type: integer, minimum: 0 }, status: { type: string }, build_status: { type: string }, created_at: { type: string, format: date-time } } }
    AdminHTTPOverview: { type: object, additionalProperties: false, required: [request_rate, error_rate, p50_latency_ms, p95_latency_ms, p99_latency_ms, sample_count], properties: { request_rate: { type: number, minimum: 0 }, error_rate: { type: number, minimum: 0, maximum: 1 }, p50_latency_ms: { type: number, minimum: 0 }, p95_latency_ms: { type: number, minimum: 0 }, p99_latency_ms: { type: number, minimum: 0 }, sample_count: { type: integer, format: int64, minimum: 0 } } }
    AdminOperationSummary: { type: object, additionalProperties: false, required: [active_deployments, queued_jobs, running_jobs, failed_jobs], properties: { active_deployments: { type: integer, format: int64, minimum: 0 }, queued_jobs: { type: integer, format: int64, minimum: 0 }, running_jobs: { type: integer, format: int64, minimum: 0 }, failed_jobs: { type: integer, format: int64, minimum: 0 } } }
    AdminOperation: { type: object, additionalProperties: false, required: [id, kind, name, status, duration_ms, created_at], properties: { id: { type: string, format: uuid }, kind: { type: string, enum: [function_deployment, site_deployment, function_execution, agent_run, artifact_cleanup, database_backup] }, name: { type: string }, project_id: { type: [string, 'null'], format: uuid }, project_name: { type: [string, 'null'] }, status: { type: string }, started_at: { type: [string, 'null'], format: date-time }, finished_at: { type: [string, 'null'], format: date-time }, duration_ms: { type: integer, format: int64, minimum: 0 }, error: { type: [string, 'null'] }, created_at: { type: string, format: date-time } } }
    AdminOperationsResponse: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: './admin-core.yaml#/components/schemas/AdminOperation' } } } }
    AdminAuditEvent: { type: object, additionalProperties: false, required: [id, action, target_type, metadata, created_at], properties: { id: { type: string, format: uuid }, organization_id: { type: [string, 'null'], format: uuid }, actor_account_id: { type: [string, 'null'], format: uuid }, actor_email: { type: [string, 'null'], format: email }, action: { type: string }, target_type: { type: string }, target_id: { type: [string, 'null'], format: uuid }, metadata: { type: object, additionalProperties: true }, created_at: { type: string, format: date-time } } }
    AdminAuditResponse: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: './admin-core.yaml#/components/schemas/AdminAuditEvent' } }, next_cursor: { type: string, format: uuid } } }
