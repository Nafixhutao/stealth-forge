components:
  schemas:
    BootstrapStatusResponse: { type: object, additionalProperties: false, required: [setup_required], properties: { setup_required: { type: boolean, description: Whether the first Instance Owner still needs to be created. } } }
    BootstrapSessionResponse: { type: object, additionalProperties: false, required: [setup_code, expires_at], properties: { setup_code: { type: string, minLength: 22, maxLength: 22, pattern: '^STEALTH-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$', description: One-time code shown only to the CLI operator. }, expires_at: { type: string, format: date-time } } }
    VerifyBootstrapCodeRequest: { type: object, additionalProperties: false, required: [setup_code], properties: { setup_code: { type: string, minLength: 22, maxLength: 22, pattern: '^STEALTH-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$', writeOnly: true } } }
    BootstrapVerificationResponse: { type: object, additionalProperties: false, required: [authorization_session_id, expires_at], properties: { authorization_session_id: { type: string, format: uuid }, expires_at: { type: string, format: date-time } } }
    BootstrapAdoptionAccount: { type: object, additionalProperties: false, required: [id, created_at], properties: { id: { type: string, format: uuid }, email: { type: [string, 'null'], format: email }, provider: { type: [string, 'null'], enum: [github, null] }, provider_login: { type: [string, 'null'] }, created_at: { type: string, format: date-time } } }
    BootstrapAdoptionAccountsResponse: { type: object, additionalProperties: false, required: [accounts], properties: { accounts: { type: array, items: { $ref: './bootstrap-setup.yaml#/components/schemas/BootstrapAdoptionAccount' } } } }
    AdoptInstanceOwnerRequest: { type: object, additionalProperties: false, required: [account_id], properties: { account_id: { type: string, format: uuid } } }
    AdoptInstanceOwnerResponse: { type: object, additionalProperties: false, required: [status, account_id], properties: { status: { type: string, const: adopted }, account_id: { type: string, format: uuid } } }
    SetupStatusResponse: { type: object, additionalProperties: false, required: [setup_required, ready, state], properties: { setup_required: { type: boolean }, ready: { type: boolean }, state: { $ref: './bootstrap-setup.yaml#/components/schemas/SetupState' } } }
    SetupState: { type: object, additionalProperties: false, required: [version, phase, draft, github, cloudflare, updated_at], properties: { version: { type: integer, minimum: 1 }, phase: { type: string, enum: [collecting, install_requested, installing, complete, failed, handoff] }, step: { type: string, maxLength: 120 }, error_code: { type: string, maxLength: 120 }, error_message: { type: string, maxLength: 240 }, draft: { $ref: './bootstrap-setup.yaml#/components/schemas/SetupDraft' }, github: { $ref: './bootstrap-setup.yaml#/components/schemas/SetupGitHubState' }, cloudflare: { $ref: './bootstrap-setup.yaml#/components/schemas/SetupCloudflareState' }, updated_at: { type: string, format: date-time }, last_event_id: { type: integer, format: int64, minimum: 0 } } }
    SetupDraft: { type: object, additionalProperties: false, properties: { instance_name: { type: string, maxLength: 120 }, public_url: { type: string, format: uri }, network_mode: { type: string, enum: [cloudflare_tunnel, public_ip, reverse_proxy, local_only] }, hostname: { type: string, maxLength: 253 }, cloudflare_account_id: { type: string, maxLength: 128 }, cloudflare_zone_id: { type: string, maxLength: 128 }, cloudflare_tunnel_id: { type: string, maxLength: 128 }, cloudflare_tunnel_name: { type: string, maxLength: 120 }, cloudflare_record_id: { type: string, maxLength: 128 }, database_mode: { type: string, enum: [bundled, external] }, database_tested: { type: boolean }, redis_mode: { type: string, enum: [bundled, external] }, redis_tested: { type: boolean }, storage_mode: { type: string, enum: [local, s3] }, storage_tested: { type: boolean }, storage_s3_endpoint: { type: string, format: uri, writeOnly: true }, storage_s3_region: { type: string, writeOnly: true }, storage_s3_bucket: { type: string, writeOnly: true }, storage_s3_use_ssl: { type: boolean, writeOnly: true }, storage_s3_path_style: { type: boolean, writeOnly: true }, storage_s3_prefix: { type: string, writeOnly: true }, oauth_github_client_id: { type: string, maxLength: 256 }, oauth_google_client_id: { type: string, maxLength: 256 } } }
    SetupGitHubState: { type: object, additionalProperties: false, description: "The connected App identifier and setup authorization session are public projections; client secrets, OAuth state, and PKCE verifiers remain encrypted server-side.", properties: { mode: { type: string, enum: [manual] }, client_id: { type: string, maxLength: 160 }, connected: { type: boolean }, authorization_session: { type: string, format: uuid } } }
    SetupCloudflareState: { type: object, additionalProperties: false, description: OAuth is retained only as an inactive experimental compatibility value. Production setup uses api_token., properties: { mode: { type: string, enum: [oauth, api_token] }, connected: { type: boolean }, expires_at: { type: string, format: date-time }, token_valid: { type: boolean } } }
    SetupConfigRequest: { type: object, additionalProperties: false, required: [instance_name, network_mode, database_mode, redis_mode, storage_mode], properties: { instance_name: { type: string, minLength: 1, maxLength: 120 }, public_url: { type: string, format: uri }, network_mode: { type: string, enum: [cloudflare_tunnel, public_ip, reverse_proxy, local_only] }, hostname: { type: string, maxLength: 253 }, database_mode: { type: string, enum: [bundled, external] }, database_url: { type: string, format: uri, maxLength: 2048, writeOnly: true }, redis_mode: { type: string, enum: [bundled, external] }, redis_url: { type: string, format: uri, maxLength: 2048, writeOnly: true }, storage_mode: { type: string, enum: [local, s3] }, storage_s3_endpoint: { type: string, format: uri, maxLength: 2048, writeOnly: true }, storage_s3_region: { type: string, maxLength: 120, writeOnly: true }, storage_s3_bucket: { type: string, minLength: 3, maxLength: 63, writeOnly: true }, storage_s3_access_key: { type: string, maxLength: 512, writeOnly: true }, storage_s3_secret_key: { type: string, maxLength: 512, writeOnly: true }, storage_s3_use_ssl: { type: boolean, writeOnly: true }, storage_s3_path_style: { type: boolean, writeOnly: true }, storage_s3_prefix: { type: string, maxLength: 512, writeOnly: true }, oauth_github_client_id: { type: string, maxLength: 256 }, oauth_github_client_secret: { type: string, maxLength: 512, writeOnly: true }, oauth_google_client_id: { type: string, maxLength: 256 }, oauth_google_client_secret: { type: string, maxLength: 512, writeOnly: true } } }
    SetupGitHubAuthorizationResponse: { type: object, additionalProperties: false, required: [authorization_url, expires_at], properties: { authorization_url: { type: string, format: uri }, expires_at: { type: string, format: date-time } } }
    SetupGitHubManualRequest: { type: object, additionalProperties: false, required: [client_id, client_secret], properties: { client_id: { type: string, minLength: 1, maxLength: 160 }, client_secret: { type: string, minLength: 1, maxLength: 512, writeOnly: true }, private_key: { type: string, maxLength: 32768, writeOnly: true }, webhook_secret: { type: string, maxLength: 512, writeOnly: true } } }
    SetupCloudflareOAuthResponse: { type: object, additionalProperties: false, required: [authorization_url, expires_at], properties: { authorization_url: { type: string, format: uri }, expires_at: { type: string, format: date-time } } }
    SetupCloudflareTokenRequest: { type: object, additionalProperties: false, description: "Use a custom token scoped to the selected account with Account: Cloudflare Tunnel Edit and Account Settings Read; Zone: Zone Read and DNS Edit for both Console and workload zones when separate, and SSL and Certificates Read for the workload zone. SSL and Certificates Read is required for workload edge TLS readiness inspection. If both hostnames use the same zone, one zone scope is sufficient. Global API keys are not accepted.", required: [api_token], properties: { api_token: { type: string, minLength: 1, maxLength: 4096, writeOnly: true } } }
    SetupCloudflareTunnelRequest: { type: object, additionalProperties: false, required: [account_id, zone_id, hostname], properties: { account_id: { type: string, minLength: 1, maxLength: 128 }, zone_id: { type: string, minLength: 1, maxLength: 128 }, hostname: { type: string, minLength: 4, maxLength: 253 }, name: { type: string, maxLength: 120 } } }
    SetupCloudflareAccount: { type: object, additionalProperties: false, required: [id, name], properties: { id: { type: string, maxLength: 128 }, name: { type: string, maxLength: 255 }, created_on: { type: string } } }
    SetupCloudflareZone: { type: object, additionalProperties: false, required: [id, name], properties: { id: { type: string, maxLength: 128 }, name: { type: string, maxLength: 253 }, status: { type: string } } }
    SetupCloudflareAccountsResponse: { type: object, additionalProperties: false, required: [accounts], properties: { accounts: { type: array, items: { $ref: './bootstrap-setup.yaml#/components/schemas/SetupCloudflareAccount' } } } }
    SetupCloudflareZonesResponse: { type: object, additionalProperties: false, required: [zones], properties: { zones: { type: array, items: { $ref: './bootstrap-setup.yaml#/components/schemas/SetupCloudflareZone' } } } }
    SetupCloudflareStatusResponse: { type: object, additionalProperties: false, required: [tunnel_id, status, healthy, connections], properties: { tunnel_id: { type: string, maxLength: 128 }, status: { type: string, maxLength: 80 }, healthy: { type: boolean }, connections: { type: integer, minimum: 0 } } }
    SetupDatabaseTestRequest: { type: object, additionalProperties: false, properties: { url: { type: string, format: uri, maxLength: 2048, writeOnly: true } } }
    SetupRedisTestRequest: { type: object, additionalProperties: false, properties: { url: { type: string, format: uri, maxLength: 2048, writeOnly: true } } }
    SetupStorageTestRequest: { type: object, additionalProperties: false, properties: { endpoint: { type: string, format: uri, maxLength: 2048, writeOnly: true }, region: { type: string, maxLength: 120, writeOnly: true }, bucket: { type: string, maxLength: 63, writeOnly: true }, access_key: { type: string, maxLength: 512, writeOnly: true }, secret_key: { type: string, maxLength: 512, writeOnly: true }, use_ssl: { type: boolean, writeOnly: true }, path_style: { type: boolean, writeOnly: true } } }
    SetupTestResponse: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string, const: ok } } }
    SetupQuickTunnelRequest: { type: object, additionalProperties: false, required: [container_name, url], properties: { container_name: { type: string, pattern: '^stealth-onboarding-[A-Za-z0-9._-]+$' }, url: { type: string, format: uri, pattern: '^https://[^/]+\.trycloudflare\.com$' } } }
    SetupPreflightResponse: { type: object, additionalProperties: false, required: [checks], properties: { checks: { type: array, items: { $ref: './bootstrap-setup.yaml#/components/schemas/SetupCheck' } } } }
    SetupCheck: { type: object, additionalProperties: false, required: [name, status, detail, required], properties: { name: { type: string }, status: { type: string, enum: [pass, warn, fail] }, detail: { type: string }, required: { type: boolean } } }
    SetupInstallResponse: { type: object, additionalProperties: false, required: [status, state], properties: { status: { type: string, enum: [accepted, installing] }, state: { $ref: './bootstrap-setup.yaml#/components/schemas/SetupState' } } }
    SetupHandoffStatusResponse: { type: object, additionalProperties: false, required: [pending], properties: { pending: { type: boolean, description: Whether the one-time production handoff is still waiting for browser consumption. } } }
    SetupHandoffRequest: { type: object, additionalProperties: false, required: [token], properties: { token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true } } }
    SetupHandoffForm: { type: object, required: [token], properties: { token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true } } }
    SetupHandoffTokenResponse: { type: object, additionalProperties: false, required: [token], properties: { token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true } } }
