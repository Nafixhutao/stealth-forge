components:
  schemas:
    RegisterRequest: { type: object, additionalProperties: false, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }, organization_name: { type: string, minLength: 2, maxLength: 120 } } }
    LoginRequest: { type: object, additionalProperties: false, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, writeOnly: true } } }
    OAuthStartResponse: { type: object, additionalProperties: false, required: [authorization_url], properties: { authorization_url: { type: string, format: uri, description: Provider authorization URL the browser should follow. } } }
    AccountIdentity: { type: object, additionalProperties: false, required: [provider, created_at], properties: { provider: { type: string, enum: [github, google] }, provider_login: { type: string }, display_name: { type: string }, avatar_url: { type: string }, created_at: { type: string, format: date-time } } }
    AccountIdentitiesResponse: { type: object, additionalProperties: false, required: [items, providers], properties: { items: { type: array, items: { $ref: './account-auth.yaml#/components/schemas/AccountIdentity' } }, providers: { type: array, items: { type: string, enum: [github, google] }, description: Sign-in providers configured on this instance. } } }
    AuthVerificationRequest: { type: object, additionalProperties: false, description: Empty JSON object by default; url is optional and must be the exact configured auth route (relative or on an allowlisted origin) without a query or fragment. The emailed link is rebuilt from trusted server configuration., properties: { url: { type: string, format: uri, maxLength: 2048 } } }
    AuthTokenRequest: { type: object, additionalProperties: false, anyOf: [{ required: [token] }, { required: [secret] }], properties: { token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }, secret: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }, user_id: { type: string, format: uuid, description: Compatibility field; the opaque token is authoritative. } } }
    PasswordRecoveryRequest: { type: object, additionalProperties: false, required: [email], description: The optional url must be the exact configured auth route (relative or on an allowlisted origin) without a query or fragment. The emailed link is rebuilt from trusted server configuration., properties: { email: { type: string, format: email, maxLength: 320 }, url: { type: string, format: uri, maxLength: 2048 } } }
    PasswordResetRequest: { type: object, additionalProperties: false, required: [password], anyOf: [{ required: [token] }, { required: [secret] }], properties: { token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }, secret: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }, user_id: { type: string, format: uuid, description: Compatibility field; the opaque token is authoritative. }, password: { type: string, minLength: 12, maxLength: 256, writeOnly: true } } }
    CreateOrganizationInvitationRequest: { type: object, additionalProperties: false, required: [email, role], properties: { email: { type: string, format: email, maxLength: 320 }, role: { type: string, enum: [admin, developer, viewer, billing] } } }
    AcceptOrganizationInvitationRequest: { type: object, additionalProperties: false, anyOf: [{ required: [token] }, { required: [secret] }], properties: { token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }, secret: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true } } }
    Account: { type: object, required: [id, email_verified, created_at], properties: { id: { type: string, format: uuid }, email: { type: [string, 'null'], format: email }, email_verified: { type: boolean }, instance_role: { type: [string, 'null'], enum: [instance_owner, instance_admin, null], description: Instance-level role; this does not imply organization membership. }, provider: { type: [string, 'null'], enum: [github, null] }, provider_user_id: { type: [string, 'null'] }, provider_login: { type: [string, 'null'] }, display_name: { type: [string, 'null'] }, avatar_url: { type: [string, 'null'], format: uri }, created_at: { type: string, format: date-time } } }
    ConsoleSession: { type: object, additionalProperties: false, required: [id, is_current, expires_at, created_at], properties: { id: { type: string, format: uuid }, is_current: { type: boolean }, expires_at: { type: string, format: date-time }, created_at: { type: string, format: date-time } } }
    UpdateAccountPasswordRequest: { type: object, additionalProperties: false, required: [current_password, password], properties: { current_password: { type: string, minLength: 1, maxLength: 256, writeOnly: true }, password: { type: string, minLength: 12, maxLength: 256, writeOnly: true } } }
    AccountResponse: { type: object, required: [account], properties: { account: { $ref: './account-auth.yaml#/components/schemas/Account' } } }
    AccountSessionsResponse: { type: object, additionalProperties: false, required: [sessions], properties: { sessions: { type: array, items: { $ref: './account-auth.yaml#/components/schemas/ConsoleSession' } } } }
    RevokedSessionsResponse: { type: object, additionalProperties: false, required: [revoked], properties: { revoked: { type: integer, minimum: 0 } } }
    PasswordUpdateResponse: { type: object, additionalProperties: false, required: [sessions_revoked], properties: { sessions_revoked: { type: integer, minimum: 0 } } }
    RegisterResponse: { type: object, required: [account, organization], properties: { account: { $ref: './account-auth.yaml#/components/schemas/Account' }, organization: { $ref: './organizations.yaml#/components/schemas/Organization' } } }
