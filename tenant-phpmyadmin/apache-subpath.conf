# Serve phpMyAdmin under /db/ so the shared Console origin can proxy it without
# a second public hostname. SCRIPT_NAME stays /db/index.php, which keeps the
# links and form actions phpMyAdmin generates inside the prefix.
Alias /db /var/www/html

<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
