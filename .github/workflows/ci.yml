name: CI

on:
  # Run on every branch so the workflow remains valid when the default branch
  # changes to main (or another protected branch).
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stealth
          POSTGRES_USER: stealth
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stealth -d stealth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # This is a non-secret validation value: 32 bytes of `a`, Base64 encoded.
      FUNCTIONS_SECRET_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APPS_SECRET_KEY: YmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmI=
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Vulnerability scan
        run: |
          set -Eeuo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: Rollback schema fingerprint PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgres://stealth:ci-postgres-password@127.0.0.1:5432/stealth?sslmode=disable
        run: |
          set -Eeuo pipefail
          log_file="$RUNNER_TEMP/rollback-schema-fingerprint.log"
          go test ./internal/migrate -run '^TestSchemaFingerprintPostgreSQLIntegration$' -count=1 -v 2>&1 | tee "$log_file"
          if ! grep -Fq -- '--- PASS: TestSchemaFingerprintPostgreSQLIntegration' "$log_file" || grep -Fq -- '--- SKIP: TestSchemaFingerprintPostgreSQLIntegration' "$log_file"; then
            echo "PostgreSQL schema fingerprint integration did not pass" >&2
            exit 1
          fi

      - name: Admin alert PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgres://stealth:ci-postgres-password@127.0.0.1:5432/stealth?sslmode=disable
        run: |
          set -Eeuo pipefail
          run_and_require_tests() {
            local package="$1"
            local pattern="$2"
            shift 2
            local log_file="$RUNNER_TEMP/admin-alert-${package//\//-}.log"
            go test "$package" -run "$pattern" -count=1 -v 2>&1 | tee "$log_file"
            for test_name in "$@"; do
              if ! grep -Fq -- "--- PASS: ${test_name}" "$log_file" || grep -Fq -- "--- SKIP: ${test_name}" "$log_file"; then
                echo "required integration test did not pass: ${test_name}" >&2
                return 1
              fi
            done
          }
          run_and_require_tests ./internal/repository \
            '^(TestDeleteAlertRuleAfterNotificationDeliveryIntegration|TestDeleteAlertRuleAfterResolveRetainsAllHistoryIntegration|TestDeleteAlertRuleNeverFiredIntegration|TestDeleteAlertRuleRetainsCompletedAndRetryableDeliveriesIntegration|TestDeleteAlertRuleRetainsMultipleNotificationDeliveriesIntegration|TestEvaluateAndDeleteAdminAlertRuleRaceProducesValidHistoryIntegration|TestQueryAdminAlertEventsGlobalCursorPaginationIntegration|TestQueryAdminAlertEventsPerRulePaginationSurvivesDeletionIntegration|TestQueryAdminAlertEventsTimeRangeIntegration|TestAdminAlertMonitorReferenceValidationIntegration|TestUpdateAdminMonitorPreservesAlertRuleCompatibilityIntegration|TestAdminMonitorAlertLockOrderingIntegration|TestAdminMonitorWorkerAndRuleUpdateConcurrencyIntegration|TestAdminMonitorWorkerAndRuleDeleteConcurrencyIntegration|TestAdminMonitorRuleCompatibilityConcurrentMutationIntegration|TestDeleteAdminMonitorWithAlertRuleConflictsIntegration|TestAdminRealtimeSequenceCommitOrderingIntegration|TestAdminRealtimeSequenceRollbackIntegration)$' \
            TestDeleteAlertRuleAfterNotificationDeliveryIntegration \
            TestDeleteAlertRuleAfterResolveRetainsAllHistoryIntegration \
            TestDeleteAlertRuleNeverFiredIntegration \
            TestDeleteAlertRuleRetainsCompletedAndRetryableDeliveriesIntegration \
            TestDeleteAlertRuleRetainsMultipleNotificationDeliveriesIntegration \
            TestEvaluateAndDeleteAdminAlertRuleRaceProducesValidHistoryIntegration \
            TestQueryAdminAlertEventsGlobalCursorPaginationIntegration \
            TestQueryAdminAlertEventsPerRulePaginationSurvivesDeletionIntegration \
            TestQueryAdminAlertEventsTimeRangeIntegration \
            TestAdminAlertMonitorReferenceValidationIntegration \
            TestUpdateAdminMonitorPreservesAlertRuleCompatibilityIntegration \
            TestAdminMonitorAlertLockOrderingIntegration \
            TestAdminMonitorWorkerAndRuleUpdateConcurrencyIntegration \
            TestAdminMonitorWorkerAndRuleDeleteConcurrencyIntegration \
            TestAdminMonitorRuleCompatibilityConcurrentMutationIntegration \
            TestDeleteAdminMonitorWithAlertRuleConflictsIntegration \
            TestAdminRealtimeSequenceCommitOrderingIntegration \
            TestAdminRealtimeSequenceRollbackIntegration
          run_and_require_tests ./internal/migrate \
            '^(TestAdminAlertHistoryMigrationBackfillsAndPreservesDeliveriesIntegration|TestAdminAlertHistoryGlobalIndexMigrationIntegration|TestAdminAlertKindContractMigrationRetiresUnsupportedKindsIntegration)$' \
            TestAdminAlertHistoryMigrationBackfillsAndPreservesDeliveriesIntegration \
            TestAdminAlertHistoryGlobalIndexMigrationIntegration \
            TestAdminAlertKindContractMigrationRetiresUnsupportedKindsIntegration
          run_and_require_tests ./internal/httpapi \
            '^(TestDeleteAdminAlertRulePreservesHistoryIntegration|TestAdminRealtimeSSEIntegration|TestAdminRealtimeSSEAuthorizationLifecycleIntegration)$' \
            TestDeleteAdminAlertRulePreservesHistoryIntegration \
            TestAdminRealtimeSSEIntegration \
            TestAdminRealtimeSSEAuthorizationLifecycleIntegration

      - name: Platform hostname and ingress PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgres://stealth:ci-postgres-password@127.0.0.1:5432/stealth?sslmode=disable
        run: |
          set -Eeuo pipefail
          run_and_require_tests() {
            local package="$1"
            local pattern="$2"
            shift 2
            local log_file="$RUNNER_TEMP/platform-hostnames-${package//\//-}.log"
            go test "$package" -run "$pattern" -count=1 -v 2>&1 | tee "$log_file"
            for test_name in "$@"; do
              if ! grep -Fq -- "--- PASS: ${test_name}" "$log_file" || grep -Fq -- "--- SKIP: ${test_name}" "$log_file"; then
                echo "required platform hostname integration did not pass: ${test_name}" >&2
                return 1
              fi
            done
          }
          run_and_require_tests ./internal/migrate \
            '^TestPlatformSiteHostnameMigrationBackfillsStableGlobalLabelsIntegration$' \
            TestPlatformSiteHostnameMigrationBackfillsStableGlobalLabelsIntegration
          run_and_require_tests ./internal/repository \
            '^TestPlatformSiteAllocationAndRouteSnapshotIntegration$' \
            TestPlatformSiteAllocationAndRouteSnapshotIntegration
          run_and_require_tests ./internal/httpapi \
            '^(TestInstanceDomainSettingsIntegration|TestPlatformSiteAPIAndNarrowListenerIntegration)$' \
            TestInstanceDomainSettingsIntegration \
            TestPlatformSiteAPIAndNarrowListenerIntegration
          run_and_require_tests ./internal/migrate \
            '^TestCloudflareConnectionMigrationOnPopulatedNonCloudflareInstanceIntegration$' \
            TestCloudflareConnectionMigrationOnPopulatedNonCloudflareInstanceIntegration
          run_and_require_tests ./internal/repository \
            '^TestCloudflareConnectionPersistenceAndReconciliationIntegration$' \
            TestCloudflareConnectionPersistenceAndReconciliationIntegration
          run_and_require_tests ./internal/httpapi \
            '^TestAdminCloudflareConnectionOwnerBoundaryAndSecretProjectionIntegration$' \
            TestAdminCloudflareConnectionOwnerBoundaryAndSecretProjectionIntegration

      - name: Apps control-plane PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgres://stealth:ci-postgres-password@127.0.0.1:5432/stealth?sslmode=disable
        run: |
          set -Eeuo pipefail
          run_and_require_tests() {
            local package="$1"
            local pattern="$2"
            shift 2
            local log_file="$RUNNER_TEMP/apps-${package//\//-}.log"
            go test "$package" -run "$pattern" -count=1 -v 2>&1 | tee "$log_file"
            for test_name in "$@"; do
              if ! grep -Fq -- "--- PASS: ${test_name}" "$log_file" || grep -Fq -- "--- SKIP: ${test_name}" "$log_file"; then
                echo "required Apps integration test did not pass: ${test_name}" >&2
                return 1
              fi
            done
          }
          run_and_require_tests ./internal/migrate \
            '^(TestAppsPlatformHostnameMigrationPreservesExistingStateIntegration|TestAppDeploymentMigrationPreservesExistingAppsIntegration|TestAppHealthMigrationKeepsExistingRuntimeNonRoutableIntegration|TestAppRouteIncarnationMigrationDownRestoresPriorSchemaIntegration|TestAppRuntimeLogSourcesMigrationBackfillConstraintsAndDownIntegration|TestAppEnvironmentVariablesMigrationPreservesExistingAppsAndDownIntegration|TestAppEnvironmentValueSizeMigrationBackfillsAndRollsBackIntegration)$' \
            TestAppsPlatformHostnameMigrationPreservesExistingStateIntegration \
            TestAppDeploymentMigrationPreservesExistingAppsIntegration \
            TestAppHealthMigrationKeepsExistingRuntimeNonRoutableIntegration \
            TestAppRouteIncarnationMigrationDownRestoresPriorSchemaIntegration \
            TestAppRuntimeLogSourcesMigrationBackfillConstraintsAndDownIntegration \
            TestAppEnvironmentVariablesMigrationPreservesExistingAppsAndDownIntegration \
            TestAppEnvironmentValueSizeMigrationBackfillsAndRollsBackIntegration
          run_and_require_tests ./internal/repository \
            '^(TestAppsPersistenceGenerationAndPlanLimitIntegration|TestAppsSharedHostnameNamespaceConcurrencyAndSiteRouteIsolationIntegration|TestAppDeploymentSnapshotSelectionAndQuotaIntegration|TestAppDeploymentConcurrentVersionsAndLeaseFencingIntegration|TestAppDeploymentSelectionRollbackQuotaAndDeletionCleanupIntegration|TestAppAndProjectDeletionWaitForArtifactPublishReservationsIntegration)$' \
            TestAppsPersistenceGenerationAndPlanLimitIntegration \
            TestAppsSharedHostnameNamespaceConcurrencyAndSiteRouteIsolationIntegration \
            TestAppDeploymentSnapshotSelectionAndQuotaIntegration \
            TestAppDeploymentConcurrentVersionsAndLeaseFencingIntegration \
            TestAppDeploymentSelectionRollbackQuotaAndDeletionCleanupIntegration \
            TestAppAndProjectDeletionWaitForArtifactPublishReservationsIntegration
          run_and_require_tests ./internal/repository \
            '^(TestAppRollbackRestoresWorkloadAndPreservesEnvironmentIntegration|TestAppRollbackRejectionsPreserveDesiredStateIntegration|TestAppRollbackConcurrentRequestsSerializeIntegration)$' \
            TestAppRollbackRestoresWorkloadAndPreservesEnvironmentIntegration \
            TestAppRollbackRejectionsPreserveDesiredStateIntegration \
            TestAppRollbackConcurrentRequestsSerializeIntegration
          run_and_require_tests ./internal/repository \
            '^(TestAppRuntimeLeaseFencingFailureRecoveryAndConvergenceIntegration|TestProjectDeletionQueuesRuntimeCleanupBeforeAppCascadeIntegration|TestRuntimeImageProtectionIncludesSelectedDisabledAndLiveLeaseDeploymentsIntegration|TestRuntimeImageProtectionBatchesLargeCandidateInventoryIntegration|TestAppRuntimeCleanupQueueTerminalDeduplicationAndBoundedRetentionIntegration|TestAppRuntimeCleanupExpiredLeaseRecoveryFencesStaleWorkerIntegration|TestAppRuntimeMigrationCanBeAppliedWithoutLegacyRuntimeStateIntegration|TestAppHealthConvergenceFencesStaleProbesAndControlsRouteSnapshotIntegration|TestAppRuntimeAddressValidityProjectionAndIngressParityIntegration|TestAppSameContainerRestartRequiresFreshHealthBeforeRoutingIntegration|TestAppRuntimeLogSourcesRetainVerifiedContainerHistoryIntegration|TestAppEnvironmentVariablePersistenceGenerationAuthorizationAndLeaseFencingIntegration|TestAppEnvironmentAggregateValueLimitIsTransactionalIntegration|TestAppRollbackFencesStaleRuntimeWorkerIntegration|TestAppDiagnosticsProjectionStatesIntegration)$' \
            TestAppRuntimeLeaseFencingFailureRecoveryAndConvergenceIntegration \
            TestProjectDeletionQueuesRuntimeCleanupBeforeAppCascadeIntegration \
            TestRuntimeImageProtectionIncludesSelectedDisabledAndLiveLeaseDeploymentsIntegration \
            TestRuntimeImageProtectionBatchesLargeCandidateInventoryIntegration \
            TestAppRuntimeCleanupQueueTerminalDeduplicationAndBoundedRetentionIntegration \
            TestAppRuntimeCleanupExpiredLeaseRecoveryFencesStaleWorkerIntegration \
            TestAppRuntimeMigrationCanBeAppliedWithoutLegacyRuntimeStateIntegration \
            TestAppHealthConvergenceFencesStaleProbesAndControlsRouteSnapshotIntegration \
            TestAppRuntimeAddressValidityProjectionAndIngressParityIntegration \
            TestAppSameContainerRestartRequiresFreshHealthBeforeRoutingIntegration \
            TestAppRuntimeLogSourcesRetainVerifiedContainerHistoryIntegration \
            TestAppEnvironmentVariablePersistenceGenerationAuthorizationAndLeaseFencingIntegration \
            TestAppEnvironmentAggregateValueLimitIsTransactionalIntegration \
            TestAppRollbackFencesStaleRuntimeWorkerIntegration \
            TestAppDiagnosticsProjectionStatesIntegration
          run_and_require_tests ./internal/httpapi \
            '^TestAppsAPIControlPlaneAuthorizationAndProjectionIntegration$' \
            TestAppsAPIControlPlaneAuthorizationAndProjectionIntegration

      - name: Docker image build
        run: docker build --target api -t stealth-api .

      - name: Ingress control image build
        run: docker build --target ingress-control -t stealth-ingress-control:ci .

      - name: Setup security regression
        run: ./scripts/setup-security-test.sh

      - name: Traefik security regression
        run: ./scripts/traefik-security-test.sh

      - name: Build setup image without Docker tooling
        run: docker build --target setup -t stealth-setup:ci .

      - name: Verify setup image has no Docker binaries
        env:
          STEALTH_SETUP_IMAGE_FOR_TEST: stealth-setup:ci
        run: ./scripts/setup-security-test.sh

  installer:
    name: Installer and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum

      - name: Validate bootstrap and release scripts
        run: |
          for script in scripts/bootstrap.sh scripts/bootstrap_test.sh scripts/release_workflow_test.sh scripts/managed-asset-upgrade-smoke.sh scripts/real-v025-upgrade-smoke.sh scripts/compose-production-smoke.sh scripts/app-host-reboot-acceptance.sh scripts/app-host-reboot-qemu-vm.sh scripts/public-hosting-acceptance.sh scripts/public-hosting-addresses.sh scripts/public-hosting-addresses-test.sh scripts/traefik-security-test.sh; do
            bash -n "$script"
          done

      - name: Test public acceptance redirect policy
        run: python3 -m unittest discover -s scripts -p 'test_public_hosting_redirect.py'

      - name: Test public acceptance address selection
        run: bash scripts/public-hosting-addresses-test.sh

      - name: Verify release smoke revision pinning
        run: ./scripts/release_workflow_test.sh

      - name: Test bootstrap failure handling
        run: ./scripts/bootstrap_test.sh

      - name: Build CLI
        run: go build ./cmd/stealth

      - name: Build Linux amd64 CLI
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/stealth

      - name: Build Linux arm64 CLI
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/stealth

      - name: Validate production Compose file
        run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet

      - name: Traefik security regression
        run: ./scripts/traefik-security-test.sh

      - name: Docker uninstall purge integration
        env:
          TEST_DOCKER_INTEGRATION: "1"
        run: go test ./internal/cli -run '^TestPurgeCurrentManagedVolumesDockerIntegration$' -count=1 -v

  console:
    name: Console checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            console/tools/openapi-codegen/package-lock.json
            console/tools/eslint/package-lock.json

      - name: Install console dependencies
        working-directory: console
        run: npm ci

      - name: Dependency audit
        working-directory: console
        run: npm audit --omit=dev --audit-level=high

      - name: Generate OpenAPI client
        working-directory: console
        run: npm run api:generate

      - name: Verify generated client is committed
        run: git diff --exit-code -- console/src/api/generated

      - name: Check formatting
        working-directory: console
        run: npm run format:check

      - name: Typecheck
        working-directory: console
        run: npm run typecheck

      - name: Lint
        working-directory: console
        run: npm run lint

      - name: Unit tests
        working-directory: console
        run: npm run test

      - name: Production build
        working-directory: console
        run: npm run build

      - name: Install Playwright browser
        working-directory: console
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: console
        run: npm run test:e2e

      - name: Docker image build
        run: docker build -f console/Dockerfile -t stealth-console:test .

  dependency-review:
    name: Dependency review
    # Requires the repository dependency graph (a manual GitHub setting) and the
    # `DEPENDENCY_REVIEW_ENABLED` repository variable. Enable both to turn this
    # into a hard gate; otherwise the job is skipped.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
