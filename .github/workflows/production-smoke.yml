name: Production Compose Smoke

on:
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance:
        description: Acceptance suite to run
        type: choice
        options:
          - compose-smoke
          - apps-host-reboot
        default: compose-smoke
        required: true
      host_mode:
        description: Host for the Apps reboot acceptance
        type: choice
        options:
          - ephemeral-qemu
          - ssh
        default: ephemeral-qemu
        required: true

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke-fresh-install:
    if: github.event_name != 'workflow_dispatch' || inputs.acceptance == 'compose-smoke'
    name: Fresh production install smoke
    uses: ./.github/workflows/production-smoke-suite.yml
    with:
      suite: fresh-install

  production-smoke-v025-upgrade:
    if: github.event_name != 'workflow_dispatch' || inputs.acceptance == 'compose-smoke'
    name: Real v0.2.5 upgrade smoke
    uses: ./.github/workflows/production-smoke-suite.yml
    with:
      suite: v025-upgrade

  production-smoke:
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.acceptance == 'compose-smoke')
    name: Build local images and run production smoke
    needs:
      - production-smoke-fresh-install
      - production-smoke-v025-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both production smoke suites to pass
        env:
          FRESH_INSTALL_RESULT: ${{ needs.production-smoke-fresh-install.result }}
          V025_UPGRADE_RESULT: ${{ needs.production-smoke-v025-upgrade.result }}
        run: |
          set -euo pipefail
          printf 'Fresh install smoke: %s\n' "$FRESH_INSTALL_RESULT"
          printf 'v0.2.5 upgrade smoke: %s\n' "$V025_UPGRADE_RESULT"
          if [[ "$FRESH_INSTALL_RESULT" != success || "$V025_UPGRADE_RESULT" != success ]]; then
            echo 'Both production smoke suites must pass.' >&2
            exit 1
          fi

  apps-host-reboot:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance == 'apps-host-reboot'
    uses: ./.github/workflows/apps-host-reboot-acceptance.yml
    with:
      host_mode: ${{ inputs.host_mode }}
