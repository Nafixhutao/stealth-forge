[package]
name = "stealth-agent"
version = "0.1.0"
edition = "2021"
description = "Stealth's trusted Rust agent runner"
license = "Apache-2.0"

[[bin]]
name = "stealth-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
