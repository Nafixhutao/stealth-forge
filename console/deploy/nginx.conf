# Place this server behind your TLS termination or add certificates here.
# The API path is same-origin so the Go session cookie works without a browser CORS hop.
# Nginx includes files in conf.d from the http context, so these maps are valid here.
#
# This assumes the preceding load balancer/ingress is trusted and sanitizes
# X-Forwarded-Proto before forwarding traffic. Do not expose this listener to
# untrusted clients while accepting arbitrary forwarded headers.
#
# The API is sent the original $http_host (not $host) so the externally visible
# origin keeps the client's port. First-run setup compares the browser Origin
# against that origin (the loopback fallback at http://localhost:8081 has a
# non-default port), and production redirect URLs stay canonical because the
# API strips default ports.
map $http_x_forwarded_proto $stealth_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Use the normalized external protocol for HSTS as well. This keeps local HTTP
# development unpinned while preserving HTTPS when TLS terminates upstream.
map $stealth_forwarded_proto $stealth_hsts {
    default "";
    https "max-age=31536000; includeSubDomains";
}

upstream stealth_console_web {
    server stealth-web:3000;
}

upstream stealth_api {
    server stealth-api:8080;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    # The setup wizard posts GitHub App Manifest data to GitHub. Keep this
    # cross-origin form target limited to GitHub's app registration flow.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://github.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com https://avatars.githubusercontent.com; font-src 'self' data:; connect-src 'self';" always;
    add_header Strict-Transport-Security $stealth_hsts always;

    # SSE must not wait in an intermediary buffer. Keep this scoped to the
    # project realtime endpoint; ordinary API responses retain normal proxy
    # behavior. The Go API still authorizes the project and session.
    location ~ "^/v1/projects/[0-9a-fA-F-]{36}/realtime$" {
        proxy_pass http://stealth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $stealth_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /v1/ {
        proxy_pass http://stealth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $stealth_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # The public status site, also reachable on the Console's own origin so the
    # product's Status link never depends on the status hostname's DNS. The
    # trailing-slash form keeps the site's relative asset URLs working.
    location = /status {
        return 301 /status/;
    }

    location ^~ /status/ {
        root /usr/share/nginx/html;
        index index.html;
        # Revalidate instead of heuristically caching: the files are not
        # fingerprinted. `expires` does not reset the inherited add_headers the
        # way a location-level add_header would.
        expires -1;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://stealth_console_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $stealth_forwarded_proto;
    }
}

# Public, unauthenticated status page on its own hostname. It serves the static
# status site plus the one public endpoint that site renders, so no other API
# surface — admin included — is reachable from this host.
server {
    listen 80;
    server_name status.nazxf.my.id;
    root /usr/share/nginx/html/status;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    # No 'unsafe-inline' here: the site ships external CSS and JS only, so the
    # status origin can hold a stricter policy than the Console's.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self';" always;
    add_header Strict-Transport-Security $stealth_hsts always;

    location = /v1/status-page {
        proxy_pass http://stealth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $stealth_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
